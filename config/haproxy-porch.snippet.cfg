# Porch per-host cookie (porch_host): HAProxy changes for /etc/haproxy/haproxy.cfg
#
# NOT included by any config. These are hand edits to `frontend www-https`,
# written against the live file (frontend www-https, backend cush_auth ->
# 127.0.0.1:9512, ACLs host_auth / panel / tunnelroot / tunnel / needs_auth).
# Back up first (sudo cp /etc/haproxy/haproxy.cfg /etc/haproxy/backups/...),
# then `sudo haproxy -c -f /etc/haproxy/haproxy.cfg` before every reload.
#
# Three steps, applied separately (C: public paths, see the end):
#   STEP A  route /__porch/ on every host to the auth server. Safe on its own:
#           nothing else changes and apps keep accepting cush_auth.
#           Verify with:  bin/porch-auth-check <host>   (for a few hosts)
#   STEP B  stop forwarding cush_auth to tunnel hosts. ONLY after step A is
#           verified and the owner has signed in (Owner? Sign in) on the
#           tunnel apps they use; then optionally run the apps with
#           PORCH_ACCEPT_LEGACY_COOKIE=0.
#
# ============================================================================
# STEP A: /__porch/ -> cush_auth on every host
# ============================================================================
#
# A1. Next to the other ACLs, directly after the existing line
#         acl host_auth hdr(host) -i auth.cush.rocks
#     add:

	acl porch_path path_beg /__porch/

# A2. Directly after the existing line
#         use_backend cush_auth if host_auth
#     add (use_backend rules run in file order, so this must come before
#     `use_backend tunnel if tunnel` and every other per-host use_backend):

	use_backend cush_auth if porch_path

# A3. Let /__porch/ through the forward-auth gate on protected hosts. Replace
#     the existing redirect line
#         http-request redirect code 302 location https://auth.cush.rocks/login?rd=https%%3A%%2F%%2F%[hdr(host)]%[path] if needs_auth !cush_authed !host_auth !letsencrypt-acl !beszel_agent_ws
#     with (only `!porch_path` is new):

	http-request redirect code 302 location https://auth.cush.rocks/login?rd=https%%3A%%2F%%2F%[hdr(host)]%[path] if needs_auth !cush_authed !host_auth !letsencrypt-acl !beszel_agent_ws !porch_path

# Notes for step A:
#  * The cush_auth stripping rules below the redirect still run for /__porch/
#    requests on non-exempt hosts. That is fine: /__porch/start, /__porch/auth
#    and /__porch/me read only __Host-porch_state and porch_host, never
#    cush_auth.
#  * The auth server only answers /__porch/ for one label under cush.rocks or
#    tunnel.cush.rocks (HANDOFF_HOST_RE) and refuses auth.cush.rocks itself.

# ============================================================================
# STEP B: strip cush_auth on *.tunnel.cush.rocks (apply after A is verified)
# ============================================================================
#
# The existing block after the "Do not forward the raw cush_auth device
# token to backends" comment has seven rules exempting
# `host_auth`, `panel`, `tunnelroot` and `tunnel`. Drop the `tunnel`
# exemption from all seven, so the cookie stops reaching frps (and so a
# friend's tunnel). The media/music/drop servers then rely on porch_host.
# Replace those seven lines with:

	http-request set-header Cookie "%[req.fhdr(cookie,1)]; %[req.fhdr(cookie,2)]" if { req.fhdr_cnt(cookie) eq 2 } !host_auth !panel !tunnelroot
	http-request set-header Cookie "%[req.fhdr(cookie,1)]; %[req.fhdr(cookie,2)]; %[req.fhdr(cookie,3)]" if { req.fhdr_cnt(cookie) eq 3 } !host_auth !panel !tunnelroot
	http-request replace-header Cookie '^(.*;[ \t]*|[ \t]*)cush_auth=[^;]*;[ \t]*(.*)$' '\1\2' unless host_auth || panel || tunnelroot
	http-request replace-header Cookie '^(.*;[ \t]*|[ \t]*)cush_auth=[^;]*;[ \t]*(.*)$' '\1\2' unless host_auth || panel || tunnelroot
	http-request replace-header Cookie '^(.*);[ \t]*cush_auth=[^;]*$' '\1' unless host_auth || panel || tunnelroot
	http-request replace-header Cookie '^[ \t]*cush_auth=[^;]*()$' '\1' unless host_auth || panel || tunnelroot
	http-request del-header Cookie if { req.fhdr_cnt(cookie) eq 1 } { req.fhdr(cookie) -m len 0 } !host_auth !panel !tunnelroot

# and update the comment above them: *.tunnel.cush.rocks is no longer exempt.
#
# B2 (optional, later). panel.cush.rocks and tunnel.cush.rocks run
# statusserver.py, which also accepts porch_host now. Once the owner has
# signed in on those hosts (the console's "Owner? Sign in on this host"
# link), the same edit with `panel` and `tunnelroot` removed leaves
# host_auth as the only host that sees cush_auth. The landing page panel on
# tunnel.cush.rocks still links to auth.cush.rocks for enrolment and has no
# /__porch/start link yet, so keep tunnelroot exempt until it does.

# ============================================================================
# STEP C: public paths on gated hosts (bin/haproxy-porch c)
# ============================================================================
#
# Needs step A and the two maps the auth server writes (empty at first):
# /etc/haproxy/maps/cush-public.map (prefixes) and cush-public-exact.map
# (exact paths). Run bin/auth-deploy first. The lines are the ones in
# config/templates/haproxy.cfg.tmpl (gate_acls + gate fragments).
#
# C1. Directly after the `acl needs_auth ...` line add:

	acl public_path var(txn.cush_hp),map_beg(/etc/haproxy/maps/cush-public.map) -m found
	acl public_path var(txn.cush_hp),map_str(/etc/haproxy/maps/cush-public-exact.map) -m found
	acl odd_path path_sub -i .. // %2e %2f %5c ; '\'
	acl public_ok var(txn.cush_public) -m bool

# C2. Directly after `http-request set-var(txn.cush_host) hdr(host),lower` add:

	http-request set-var(txn.cush_path) path
	http-request set-var(txn.cush_hp) var(txn.cush_host),concat(,txn.cush_path,)
	http-request set-var(txn.cush_public) bool(1) if public_path !odd_path

# C3. Append ` !public_ok` to the three `X-Cush-*` set-header lines (no
#     identity on a public hit, even for the owner) and to the forward-auth
#     redirect (a public path skips the login).
#
# A path with .., //, %2e, %2f, %5c, a backslash or ; is never public: it
# meets the gate as before. Nothing changes on hosts without entries.
#
# Rollback for any step: restore the backup and reload.
